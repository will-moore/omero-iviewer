<template>
    <div show.bind="visible"
         style="position: fixed; z-index: 1000; width: 250px; min-height: 100px;
                background: #f8f8f8; border: solid #ddd 1px; border-radius: 3px;
                box-shadow: 2px 2px 5px #ccc; left: ${left}px; top: ${top}px;">
        <div mousedown.trigger="onDragStart($event)"
             style="cursor: move; padding: 3px 5px; background: #e8e8e8;
                    user-select: none; display: flex; justify-content: space-between;">
            <span>ROI Tags</span>
            <span style="cursor: pointer;" title="Close"
                  mousedown.trigger="$event.stopPropagation()"
                  click.delegate="hide()">&times;</span>
        </div>
        <div style="padding: 5px; max-height: 200px; overflow-y: auto;">
            <div show.bind="!tags_loaded">Loading...</div>
            <div show.bind="tags_loaded && tags.length === 0">No tags found</div>
            <ul class="list-unstyled" style="margin: 0;">
                <li repeat.for="tag of tags"
                    click.delegate="selectTag(tag)"
                    dblclick.delegate="linkTag(tag)"
                    style="cursor: pointer; padding: 1px 3px;"
                    title="Tag ID: ${tag.id}">${tag.value}</li>
            </ul>
        </div>
    </div>
</template>
